query GetDashboard {
	sessionUser {
		isMaker
		patreon
		isSubscriber
		grantAt
		spendAcct {
			current {
				balance
			}
		}
		sponsoredMakers {
			items {
				name
			}
		}
		subscription {
			amt
			status
			insertedAt
		}
	}
	sessionMaker {
		patreon
		sponsors {
			items {
				name
			}
		}
	}
}
